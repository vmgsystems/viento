apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: viento-bench-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: viento-sqlite-bench
  namespace: apps
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: bench
          image: python:3.11-slim
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - python3
            - -c
            - |
              import json, sqlite3, threading, time
              def apply_pragmas(c, wal):
                  c.execute("PRAGMA busy_timeout=30000;")
                  if wal:
                      c.execute("PRAGMA journal_mode=WAL;")
                      c.execute("PRAGMA synchronous=NORMAL;")
                      c.execute("PRAGMA cache_size=-64000;")
                      c.execute("PRAGMA temp_store=MEMORY;")
                      c.execute("PRAGMA mmap_size=268435456;")
                  else:
                      c.execute("PRAGMA journal_mode=DELETE;")
                      c.execute("PRAGMA synchronous=FULL;")
                      c.execute("PRAGMA cache_size=-2000;")
              report = {"methodology": "symmetric-autocommit-and-batched", "iterations": 200}
              for mode, wal in [("delete_default", False), ("wal_tuned", True)]:
                  db = f"/bench/{mode}.db"
                  w = sqlite3.connect(db, timeout=30.0, isolation_level=None)
                  r = sqlite3.connect(db, timeout=30.0, isolation_level=None)
                  apply_pragmas(w, wal); apply_pragmas(r, wal)
                  w.execute("CREATE TABLE IF NOT EXISTS hb (id INTEGER PRIMARY KEY AUTOINCREMENT, m INT, s INT, p REAL, ts INT);")
                  t0 = time.perf_counter()
                  for i in range(200): w.execute("INSERT INTO hb (m, s, p, ts) VALUES (?, 1, 4.2, ?);", (i % 35, i))
                  t_auto = (time.perf_counter() - t0) * 1000.0
                  t1 = time.perf_counter()
                  for m in range(35): r.execute("SELECT AVG(p), COUNT(*) FROM hb WHERE m = ?;", (m,)).fetchone()
                  t_q = (time.perf_counter() - t1) * 1000.0
                  t2 = time.perf_counter()
                  w.execute("BEGIN IMMEDIATE;")
                  for i in range(200): w.execute("INSERT INTO hb (m, s, p, ts) VALUES (?, 1, 3.8, ?);", (i % 35, i))
                  w.execute("COMMIT;")
                  t_batch = (time.perf_counter() - t2) * 1000.0
                  b = threading.Barrier(2, timeout=30.0)
                  def cw():
                      c = sqlite3.connect(db, timeout=30.0, isolation_level=None); apply_pragmas(c, wal); b.wait()
                      for i in range(100): c.execute("INSERT INTO hb (m, s, p, ts) VALUES (?, 1, 5.1, ?);", (i % 35, i))
                      c.close()
                  def cr():
                      c = sqlite3.connect(db, timeout=30.0, isolation_level=None); apply_pragmas(c, wal); b.wait()
                      for m in range(100): c.execute("SELECT AVG(p), COUNT(*) FROM hb WHERE m = ?;", (m % 35,)).fetchone()
                      c.close()
                  t3 = time.perf_counter()
                  tw, tr = threading.Thread(target=cw), threading.Thread(target=cr)
                  tw.start(); tr.start(); tw.join(); tr.join()
                  t_conc = (time.perf_counter() - t3) * 1000.0
                  w.close(); r.close()
                  report[mode] = {"autocommit_insert_ms": round(t_auto, 2), "interleaved_query_ms": round(t_q, 2), "batched_tx_ms": round(t_batch, 2), "concurrent_rw_ms": round(t_conc, 2), "total_ms": round(t_auto + t_q + t_batch + t_conc, 2)}
              print(json.dumps(report, indent=2))
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: bench-vol
              mountPath: /bench
      volumes:
        - name: bench-vol
          persistentVolumeClaim:
            claimName: viento-bench-pvc
